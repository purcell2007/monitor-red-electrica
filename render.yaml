# Despliegue en Render (https://render.com) con un clic desde el repositorio
services:
  - type: web
    name: monitor-red-electrica
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
